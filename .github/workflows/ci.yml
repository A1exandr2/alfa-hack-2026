name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Security и Docker integration tests запускаются автоматически.
# Дополнительные проверки включаются через repository variables.
# Все jobs выполняются на credit-local. PR из чужих fork не запускаются на локальном ПК.
jobs:
  gitleaks:
    name: Security / Gitleaks
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Linux, X64, credit]
    timeout-minutes: 10
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan secrets
        run: |
          docker run --rm -v "$PWD:/repo:ro" \
            -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory \
            -e GIT_CONFIG_VALUE_0=/repo \
            zricethezav/gitleaks:v8.18.2 \
            detect --source=/repo --redact --verbose

  semgrep:
    name: Security / Semgrep
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Linux, X64, credit]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Static analysis
        run: |
          docker run --rm -v "$PWD:/src:ro" -w /src \
            semgrep/semgrep:1.116.0 \
            semgrep scan --config=p/java --config=p/python \
            --config=p/javascript --config=p/security-audit --error .

  trivy-dependencies:
    name: Security / Trivy dependencies
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Linux, X64, credit]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Scan dependencies
        run: |
          docker run --rm -v "$PWD:/src:ro" -w /src \
            aquasec/trivy:0.61.1 fs --scanners vuln \
            --skip-dirs devops/runner --no-progress \
            --severity HIGH,CRITICAL --exit-code 1 .

  # Заготовки: включать только после добавления соответствующего кода.
  compile-check:
    name: Build / Maven
    if: vars.ENABLE_JAVA_CI == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [self-hosted, Linux, X64, credit]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Compile and test backend
        run: |
          docker run --rm -v "$PWD:/app" -w /app/backend \
            maven:3.9-eclipse-temurin-21 mvn -B clean verify

  python-lint:
    name: Lint / Python
    if: vars.ENABLE_PYTHON_CI == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [self-hosted, Linux, X64, credit]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check Python style
        run: |
          docker run --rm -v "$PWD:/app:ro" -w /app python:3.11-slim \
            sh -ec 'pip install flake8==7.1.2 black==25.1.0; flake8 --max-line-length=100 ml; black --check ml'

  checkov:
    name: Security / Checkov Dockerfiles
    if: vars.ENABLE_DOCKER_CI == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [self-hosted, Linux, X64, credit]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check application Dockerfiles
        run: |
          docker run --rm -v "$PWD:/src:ro" -w /src \
            bridgecrew/checkov:3.2.471 \
            -f backend/Dockerfile --framework dockerfile

  docker-build-and-scan:
    name: Docker / Build and Trivy scan
    if: vars.ENABLE_DOCKER_CI == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    needs: [gitleaks, semgrep, trivy-dependencies, checkov]
    runs-on: [self-hosted, Linux, X64, credit]
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        component: [backend]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build image
        run: |
          docker build -f "${{ matrix.component }}/Dockerfile" \
            -t "credit-${{ matrix.component }}:${{ github.sha }}" .
      - name: Scan image
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:0.61.1 image --image-src docker --no-progress \
            --severity HIGH,CRITICAL --exit-code 1 \
            "credit-${{ matrix.component }}:${{ github.sha }}"

# Deploy добавим, когда появятся приложение и команда развертывания.

  docker-smoke:
    name: Docker / Integration tests
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Linux, X64, credit]
    timeout-minutes: 20
    env:
      COMPOSE_PROJECT_NAME: credit-ci-${{ github.run_id }}-${{ github.run_attempt }}
      APP_PORT: "0"
      POSTGRES_PORT: "0"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build and start
        run: make up
      - name: Backend tests
        run: make test
      - name: HTTP smoke through Nginx
        run: make check
      - name: Container logs on failure
        if: failure()
        run: docker compose --env-file .env logs --tail=100
      - name: Remove CI containers and volumes
        if: always()
        run: docker compose --env-file .env --profile test down --volumes --remove-orphans
