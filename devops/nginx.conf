worker_processes auto;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;
events { worker_connections 1024; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    server_tokens off;
    client_max_body_size 11m;
    resolver 127.0.0.11 valid=10s ipv6=off;
    server {
        listen 8080;
        root /usr/share/nginx/html;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy same-origin always;
        add_header X-Frame-Options SAMEORIGIN always;
        location / {
            try_files $uri $uri/ /index.html;
        }
        location ~ ^/(api(?:/|$)|docs(?:/|$)|redoc(?:/|$)|openapi\.json$) {
            set $backend http://backend:8080;
            # Public API gateway; upstream is fixed above, never taken from client input.
            # internal would block legitimate external API/Swagger requests.
            # nosemgrep: generic.nginx.security.missing-internal.missing-internal
            proxy_pass $backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 5s;
            proxy_read_timeout 240s;
        }
    }
}
